<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/svg+xml" href="assets/dnet-favicon.svg"><title>DNET Studio | Profile</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,Segoe UI,Arial,sans-serif;color:#fff;background:#050816;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-25%;z-index:-2;background:radial-gradient(circle at 10% 15%,#06b6d466,transparent 24%),radial-gradient(circle at 88% 15%,#8b5cf666,transparent 25%),radial-gradient(circle at 78% 88%,#ec489966,transparent 25%),radial-gradient(circle at 15% 82%,#facc1544,transparent 22%);filter:blur(55px);animation:aurora 12s ease-in-out infinite alternate}
@keyframes aurora{to{transform:translate(4%,5%) scale(1.12)}}@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.98)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes spin{to{transform:rotate(360deg)}}
.nav{width:min(1050px,94%);margin:18px auto;padding:12px 15px;border:1px solid #ffffff20;border-radius:20px;background:#ffffff0b;backdrop-filter:blur(25px);display:flex;align-items:center;justify-content:space-between;box-shadow:0 18px 60px #0008}.brand{font-weight:950;letter-spacing:.14em}.brand span{background:linear-gradient(90deg,#22d3ee,#a78bfa,#f472b6);-webkit-background-clip:text;color:transparent}.nav a{color:#cfe0ff;text-decoration:none;padding:10px 14px;border-radius:12px;background:#ffffff09}
.wrap{width:min(900px,94%);margin:28px auto 70px}.panel{position:relative;padding:38px;border-radius:32px;border:1px solid #ffffff25;background:linear-gradient(145deg,#ffffff14,#ffffff06);backdrop-filter:blur(30px) saturate(150%);box-shadow:0 30px 100px #000b,inset 0 1px #fff5;animation:pop .7s ease}.panel:before{content:"";position:absolute;inset:-1px;border-radius:32px;padding:1px;background:linear-gradient(120deg,#22d3ee88,#8b5cf688,#ec489988,#facc1588);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.hero{text-align:center}.avatar{width:130px;height:130px;margin:0 auto 20px;border-radius:38px;display:grid;place-items:center;overflow:hidden;font-size:3.3rem;font-weight:950;background:linear-gradient(135deg,#06b6d4,#2563eb,#8b5cf6,#ec4899);box-shadow:0 0 65px #8b5cf655;animation:float 4s ease-in-out infinite;border:2px solid #ffffff33}.avatar img{width:100%;height:100%;object-fit:cover}
.eyebrow{display:inline-block;padding:7px 12px;border-radius:99px;background:#ffffff0b;border:1px solid #ffffff18;color:#8fffe9;font-size:.75rem;font-weight:800;letter-spacing:.08em}.hero h1{font-size:clamp(2.2rem,6vw,4rem);margin:13px 0 5px;background:linear-gradient(90deg,#fff,#67e8f9,#c4b5fd,#f9a8d4,#fde68a);-webkit-background-clip:text;color:transparent}.email{color:#aab8d4;margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin:28px 0}.info{padding:18px;border:1px solid #ffffff18;border-radius:20px;background:#ffffff08}.label{font-size:.72rem;color:#8ea0bf;text-transform:uppercase;letter-spacing:.1em}.value{font-weight:850;margin-top:8px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{border:1px solid #ffffff22;background:#ffffff0a;color:#fff;text-decoration:none;padding:13px 18px;border-radius:14px;font-weight:850;cursor:pointer}.primary{border:0;background:linear-gradient(110deg,#06b6d4,#2563eb,#7c3aed,#ec4899);background-size:250%;animation:grad 6s linear infinite}@keyframes grad{to{background-position:250% 0}}.danger{background:#7f1d1d55;color:#fecaca}.edit{display:none;margin-top:24px;padding:22px;border-radius:22px;background:#0005;border:1px solid #ffffff18;text-align:left}.edit.open{display:block}.edit h3{margin-top:0}.edit input{width:100%;padding:14px;border-radius:13px;border:1px solid #ffffff20;background:#020617;color:#fff;font-size:1rem;outline:none}.edit input:focus{border-color:#67e8f9}.status{text-align:center;color:#a7f3d0;min-height:24px;margin-top:10px}.loading{opacity:.7}
@media(max-width:650px){.panel{padding:25px}.grid{grid-template-columns:1fr}.nav{margin-top:9px}.avatar{width:110px;height:110px;border-radius:32px}}
</style></head>
<body>
<header class="nav"><a class="brand" href="index.html"><span>DNET</span> STUDIO</a><a href="index.html">← Official Site</a></header>
<main class="wrap"><section class="panel">
<div class="hero"><div id="avatar" class="avatar">D</div><div class="eyebrow">✦ DNET STUDIO MEMBER</div><h1 id="name">DNET Studio User</h1><p id="email" class="email loading">Loading your Firebase profile…</p></div>
<div class="grid"><div class="info"><div class="label">Community member since</div><div id="joined" class="value">Loading…</div></div><div class="info"><div class="label">Account type</div><div id="provider" class="value">DNET Studio Member</div></div><div class="info"><div class="label">Authentication</div><div id="authType" class="value">Firebase</div></div></div>
<div class="actions"><button id="editBtn" class="btn primary">✦ Manage Profile</button><a class="btn" href="index.html">Explore DNET Studio</a><button id="logout" class="btn danger">Log Out</button></div>
<section id="edit" class="edit"><h3>Manage your profile</h3><label>Display name</label><input id="newName" maxlength="60" placeholder="Your name"><div class="actions" style="justify-content:flex-start;margin-top:12px"><button id="save" class="btn primary">Save Profile</button><button id="cancel" class="btn">Cancel</button></div><div id="status" class="status"></div></section>
</section></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyBRIxHcal7I8DyNw_uXUtn1IwGN6aksAYQ",authDomain:"dnet-studio.firebaseapp.com",projectId:"dnet-studio",storageBucket:"dnet-studio.firebasestorage.app",messagingSenderId:"741424551016",appId:"1:741424551016:web:fee4016dc5234da5f197dd",measurementId:"G-942BJH2FS6"};
const auth=getAuth(initializeApp(firebaseConfig));let user;const $=id=>document.getElementById(id);
function render(u){user=u;const name=u.displayName||"DNET Studio User";$("name").textContent=name;$("email").textContent=u.email||"No email";$("email").classList.remove("loading");$("newName").value=u.displayName||"";$("avatar").innerHTML=u.photoURL?'<img src="'+u.photoURL+'" alt="Profile picture">':name.charAt(0).toUpperCase();$("joined").textContent=u.metadata.creationTime?new Date(u.metadata.creationTime).toLocaleDateString("en-GB",{day:"2-digit",month:"long",year:"numeric"}):"—";const google=u.providerData.some(p=>p.providerId==="google.com");$("provider").textContent=google?"Google Account":"DNET Studio Member";$("authType").textContent="Firebase Auth";localStorage.setItem("dnetFirebaseUser",JSON.stringify({uid:u.uid,name,email:u.email||"",photoURL:u.photoURL||""}))}
onAuthStateChanged(auth,u=>{if(!u)location.href="signup.html";else render(u)});
$("editBtn").onclick=()=>{$("edit").classList.toggle("open");$("status").textContent=""};$("cancel").onclick=()=>{$("edit").classList.remove("open");$("status").textContent=""};
$("save").onclick=async()=>{try{await updateProfile(user,{displayName:$("newName").value.trim()||"DNET Studio User"});render(user);$("status").textContent="Profile saved successfully ✓"}catch(e){$("status").textContent="Could not save: "+e.code}};
$("logout").onclick=async()=>{await signOut(auth);localStorage.removeItem("dnetFirebaseUser");location.href="signup.html"};
</script></body></html>
